<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Dominó Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Simulador de Dominó</h1>
            <p>Salida con Doble 6 - Crecimiento a dos extremos</p>
        </header>

        <main>
            <div id="table-container" class="table">
                <!-- Domino pieces will be injected here -->
            </div>
            
            <div id="north-hand" class="hand">
                <!-- Fichas del jugador Norte -->
            </div>
            
            <div id="controls" class="hidden">
                <button id="btn-restart">Iniciar Nueva Partida</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
